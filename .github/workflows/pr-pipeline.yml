name: PR Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  check-branch-name:
    name: Check Branch Naming Convention
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Dependabot branch - skipping branch name check"
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feature|bugfix)/.+ ]]; then
            echo "Branch must start with 'feature/' or 'bugfix/'"
            exit 1
          fi
          echo "Branch name is valid!"
  check-cost-center:
    name: Check CostCenter Tag
    runs-on: ubuntu-latest
    needs: check-branch-name
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CostCenter tag on all resources
        uses: ./.github/actions/check-cost-center
        with:
          terraform_dir: ./terraform

  terraform-init:
    name: Terraform Init
    runs-on: ubuntu-latest
    needs: check-cost-center
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: terraform-init
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform